<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程师 App - 定位校验原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .container {
            max-width: 375px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
        }
        
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        /* 订单信息卡片 */
        .order-card {
            background: white;
            margin: 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .order-status {
            display: inline-block;
            background: #e8f4fd;
            color: #1890ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        
        .order-id {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .order-id span {
            color: #333;
            font-weight: 500;
        }
        
        .customer-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .customer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f0f0f0;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .customer-name {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        
        .customer-phone {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .address {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            margin-top: 12px;
        }
        
        /* 定位状态卡片 */
        .location-card {
            background: white;
            margin: 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .location-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        
        .location-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        
        .location-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .location-warning {
            display: flex;
            align-items: center;
            color: #ff4d4f;
        }
        
        .warning-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        
        .distance-info {
            text-align: right;
        }
        
        .distance-value {
            font-size: 18px;
            font-weight: 600;
            color: #ff4d4f;
        }
        
        .distance-label {
            font-size: 12px;
            color: #999;
        }
        
        .location-tips {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .location-tips.success {
            background: #f6ffed;
            border-color: #b7eb8f;
        }
        
        .location-tips.warning {
            background: #fff7e6;
            border-color: #ffd591;
        }
        
        .tip-item {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
            display: flex;
            align-items: flex-start;
        }
        
        .tip-icon {
            margin-right: 6px;
            flex-shrink: 0;
        }
        
        /* 取货码 */
        .pickup-code {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .pickup-code-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .pickup-code-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            font-family: "Courier New", monospace;
        }
        
        /* 商品清单 */
        .items-card {
            background: white;
            margin: 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .items-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        
        .item-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .item-row:last-child {
            border-bottom: none;
        }
        
        .item-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #f0f0f0;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }
        
        .item-spec {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        
        .item-quantity {
            font-size: 13px;
            color: #666;
        }
        
        /* 底部操作栏 */
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            background: white;
            padding: 12px 16px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        
        .btn-danger:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:active {
            background: #e0e0e0;
        }
        
        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        
        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .modal-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .modal-list {
            text-align: left;
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
        }
        
        .modal-list-item {
            font-size: 13px;
            color: #666;
            line-height: 1.8;
            display: flex;
            align-items: flex-start;
        }
        
        .modal-list-item:not(:last-child) {
            margin-bottom: 8px;
        }
        
        .modal-list-icon {
            margin-right: 6px;
            color: #fa8c16;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-actions .btn {
            flex: 1;
        }
        
        /* 状态切换演示 */
        .demo-controls {
            padding: 16px;
            background: #f0f0f0;
            margin: 16px;
            border-radius: 8px;
        }
        
        .demo-controls h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        
        .demo-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .demo-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📦 订单核销</h1>
        </div>
        
        <!-- 订单信息 -->
        <div class="order-card">
            <div class="order-status">待核销</div>
            <div class="order-id">订单号：<span>BD202603110001</span></div>
            <div class="customer-info">
                <div class="customer-avatar">👨</div>
                <div>
                    <div class="customer-name">张先生</div>
                    <div class="customer-phone">138****1234</div>
                </div>
            </div>
            <div class="address">
                📍 重庆市渝北区金开大道 100 号龙湖紫都城 3-2-8
            </div>
        </div>
        
        <!-- 定位状态 -->
        <div class="location-card">
            <div class="location-title">
                <span class="location-icon">📍</span>
                定位校验
            </div>
            
            <div class="location-status" id="locationStatus">
                <div class="location-warning">
                    <span class="warning-icon">⚠️</span>
                    <span>距离异常</span>
                </div>
                <div class="distance-info">
                    <div class="distance-value">850m</div>
                    <div class="distance-label">超出 500m</div>
                </div>
            </div>
            
            <div class="location-tips warning" id="locationTips">
                <div class="tip-item">
                    <span class="tip-icon">💡</span>
                    <span>请确认您是否在客户地址附近，距离过远可能影响核销</span>
                </div>
            </div>
        </div>
        
        <!-- 取货码 -->
        <div class="pickup-code">
            <div class="pickup-code-label">取货码</div>
            <div class="pickup-code-value">8 3 5 9</div>
        </div>
        
        <!-- 商品清单 -->
        <div class="items-card">
            <div class="items-title">商品清单</div>
            <div class="item-row">
                <div class="item-image">❄️</div>
                <div class="item-info">
                    <div class="item-name">空调压缩机</div>
                    <div class="item-spec">型号：QD35T</div>
                    <div class="item-quantity">× 1</div>
                </div>
            </div>
            <div class="item-row">
                <div class="item-image">🔧</div>
                <div class="item-info">
                    <div class="item-name">启动电容</div>
                    <div class="item-spec">规格：35μF</div>
                    <div class="item-quantity">× 2</div>
                </div>
            </div>
        </div>
        
        <!-- 演示控制 -->
        <div class="demo-controls">
            <h3>🎮 原型演示控制</h3>
            <button class="demo-btn active" onclick="setDistance('far')">距离异常 (850m)</button>
            <button class="demo-btn" onclick="setDistance('near')">距离正常 (50m)</button>
        </div>
        
        <!-- 底部占位 -->
        <div style="height: 80px;"></div>
    </div>
    
    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="btn btn-secondary" onclick="showConfirmModal()">📷 拍照核销</button>
        <button class="btn btn-primary" onclick="showConfirmModal()">✅ 确认收货</button>
    </div>
    
    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">距离异常提醒</div>
            <div class="modal-content">
                检测到您当前距离客户地址较远，仍要确认收货吗？
            </div>
            <div class="modal-list">
                <div class="modal-list-item">
                    <span class="modal-list-icon">✓</span>
                    <span>请确保商品已实际交付给客户</span>
                </div>
                <div class="modal-list-item">
                    <span class="modal-list-icon">✓</span>
                    <span>虚假核销可能导致账号处罚</span>
                </div>
                <div class="modal-list-item">
                    <span class="modal-list-icon">✓</span>
                    <span>建议开启精确定位提高准确性</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideConfirmModal()">再想想</button>
                <button class="btn btn-danger" onclick="confirmReceive()">仍要确认收货</button>
            </div>
        </div>
    </div>
    
    <script>
        let isFarDistance = true;
        
        function setDistance(type) {
            const statusEl = document.getElementById('locationStatus');
            const tipsEl = document.getElementById('locationTips');
            const btns = document.querySelectorAll('.demo-btn');
            
            if (type === 'far') {
                isFarDistance = true;
                statusEl.style.background = '#fff2f0';
                statusEl.style.borderColor = '#ffccc7';
                statusEl.innerHTML = `
                    <div class="location-warning">
                        <span class="warning-icon">⚠️</span>
                        <span>距离异常</span>
                    </div>
                    <div class="distance-info">
                        <div class="distance-value">850m</div>
                        <div class="distance-label">超出 500m</div>
                    </div>
                `;
                tipsEl.className = 'location-tips warning';
                tipsEl.innerHTML = `
                    <div class="tip-item">
                        <span class="tip-icon">💡</span>
                        <span>请确认您是否在客户地址附近，距离过远可能影响核销</span>
                    </div>
                `;
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
            } else {
                isFarDistance = false;
                statusEl.style.background = '#f6ffed';
                statusEl.style.borderColor = '#b7eb8f';
                statusEl.innerHTML = `
                    <div class="location-warning" style="color: #52c41a;">
                        <span class="warning-icon">✅</span>
                        <span>距离正常</span>
                    </div>
                    <div class="distance-info">
                        <div class="distance-value" style="color: #52c41a;">50m</div>
                        <div class="distance-label">在范围内</div>
                    </div>
                `;
                tipsEl.className = 'location-tips success';
                tipsEl.innerHTML = `
                    <div class="tip-item">
                        <span class="tip-icon">✅</span>
                        <span>定位校验通过，可以正常核销</span>
                    </div>
                `;
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
            }
        }
        
        function showConfirmModal() {
            document.getElementById('confirmModal').classList.add('active');
        }
        
        function hideConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }
        
        function confirmReceive() {
            alert('✅ 核销成功！\n\n订单 BD202603110001 已确认收货');
            hideConfirmModal();
        }
        
        // 点击遮罩关闭弹窗
        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideConfirmModal();
            }
        });
    </script>
</body>
</html>
